# === RUN D: v4 recipe, but the VISION TOWER IS TRAINABLE ===
# Identical to runs/qwen25vl-7b/lora_sft.yaml (= v4) except: freeze_vision_tower and
# freeze_multi_modal_projector are false, the learning rate is halved, and output_dir.
#
# WHY THIS IS THE NEXT EXPERIMENT. After v4 we ruled out the two obvious limits:
#   * eval resolution   - 8.7x more pixels moved text_sim by 0.002 (report_v4_matched)
#   * generation length - longest gold target 2443 tok vs a 3072 cap
# and the teacher is not the ceiling either (Gemini 0.929 vs v4 0.725 on the same gold).
# What is left is the vision side: v1-v4 all froze the encoder, so it never learned Arabic
# script - which also explains why extra pixels bought nothing (a frozen, Arabic-naive
# encoder yields no better features from more pixels).
# Supporting signal: Qwen3-VL-8B (newer vision encoder) was worse overall but BETTER on
# handwriting, 0.200 -> 0.347 - the one category where seeing the strokes matters most.
#
# LR is halved because the vision tower is now full-finetuned (not LoRA'd) alongside the
# LoRA'd LLM; 1e-4 on raw encoder weights risks wrecking a pretrained encoder.
#
# VRAM: noticeably higher than v4 (encoder grads + optimiser state). If it OOMs, either
# unfreeze ONLY the projector (freeze_vision_tower: true, freeze_multi_modal_projector:
# false) or move to a bigger card.
#
# Baseline to beat (v4, 53-page human test at matching 1.05M px):
#   type_accuracy 0.906 | text_sim 0.710 | keyword_recall 0.455
#
#   llamafactory-cli train runs/qwen25vl-7b/lora_sft_vision.yaml
#   python evaluate.py --adapter saves/qwen25vl-7b-lora-vision --out report_vision_human.json

### model
model_name_or_path: Qwen/Qwen2.5-VL-7B-Instruct
trust_remote_code: true
image_max_pixels: 1048576

### method — QLoRA 4-bit is OK here: Qwen2.5-VL-7B has tie_word_embeddings=false
### (lm_head is saved, not tied) so the 4-bit lm_head-tie bug that hits the 3B base
### does NOT apply. If you ever see loss stuck at 11.93, drop quantization_bit (bf16).
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target: all
quantization_bit: 4
quantization_method: bnb
freeze_vision_tower: false
freeze_multi_modal_projector: false

### dataset (shared — same ./data as Run A)
dataset_dir: ./data
dataset: flash_train
eval_dataset: flash_val
template: qwen2_vl
cutoff_len: 8192
overwrite_cache: true
preprocessing_num_workers: 8

### output (separate per run)
output_dir: saves/qwen25vl-7b-lora-vision
logging_steps: 5
save_steps: 100
save_total_limit: 5
plot_loss: true
overwrite_output_dir: true
report_to: wandb
run_name: flash-v5-vision-tower

### Mirror to the Hub WHILE training, not after. A host went into maintenance mid-run and
### took ~600 steps of progress with it; checkpoints on disk were unreachable for two days.
### hub_strategy: checkpoint pushes each save_steps checkpoint, so a dead box costs at most
### the steps since the last one. Requires `hf auth login` BEFORE launching, or the first
### push fails. Note the checkpoints carry vision-tower weights (GBs, not the ~100MB a
### frozen-tower LoRA would be), so pushes are not instant.
push_to_hub: true
hub_model_id: m-hammad/legal-flash-7b-vision
hub_private_repo: true
hub_strategy: checkpoint

### train (identical hyperparams to Run A)
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 5.0e-5
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.05
bf16: true
gradient_checkpointing: true
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 100
