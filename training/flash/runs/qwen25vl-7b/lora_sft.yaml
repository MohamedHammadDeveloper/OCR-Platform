# === RUN B: Qwen2.5-VL-7B (Apache-2.0, license-clean base) ===
# Base = Qwen/Qwen2.5-VL-7B-Instruct — Apache-2.0 (commercial/government OK), bigger
# capacity, but NO handwriting warm-start (general OCR base). Fits QLoRA in ~24-32GB.
#
# Same hyperparams / data / pixel budget as Run A → the ONLY differences are the base
# model and the output dir, so the benchmark comparison is controlled.
#
# Run FROM training/flash/:
#   llamafactory-cli train runs/qwen25vl-7b/lora_sft.yaml

### model
model_name_or_path: Qwen/Qwen2.5-VL-7B-Instruct
trust_remote_code: true
image_max_pixels: 1048576

### method — QLoRA, vision tower frozen
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target: all
quantization_bit: 4
quantization_method: bnb
freeze_vision_tower: true
freeze_multi_modal_projector: true

### dataset (shared — same ./data as Run A)
dataset_dir: ./data
dataset: flash_train
eval_dataset: flash_val
template: qwen2_vl
cutoff_len: 8192
overwrite_cache: true
preprocessing_num_workers: 8

### output (separate per run)
output_dir: saves/qwen25vl-7b-lora
logging_steps: 5
save_steps: 100
save_total_limit: 3
plot_loss: true
overwrite_output_dir: true
report_to: none

### train (identical hyperparams to Run A)
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 1.0e-4
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.05
bf16: true
gradient_checkpointing: true
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 100
