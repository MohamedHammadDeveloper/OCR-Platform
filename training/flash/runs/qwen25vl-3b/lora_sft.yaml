# === RUN A: Qwen2.5-VL-3B (handwriting warm-start base) ===
# Base = sherif1313/Arabic-English-handwritten-OCR-v3 (already fine-tuned on Arabic
# handwriting → head start on the hard skill, valuable with our small dataset).
# LICENSE: underlying Qwen2.5-VL-3B is qwen-research (NON-commercial) → use this run
# for R&D / benchmarking only; resolve commercial licensing before any production use.
#
# Run FROM training/flash/ (so ./data and ./saves resolve):
#   llamafactory-cli train runs/qwen25vl-3b/lora_sft.yaml

### model
model_name_or_path: sherif1313/Arabic-English-handwritten-OCR-v3
trust_remote_code: true
image_max_pixels: 1048576

### method — QLoRA, vision tower frozen (identical to Run B for a fair comparison)
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target: all
quantization_bit: 4
quantization_method: bnb
freeze_vision_tower: true
freeze_multi_modal_projector: true

### dataset (shared)
dataset_dir: ./data
dataset: flash_train
eval_dataset: flash_val
template: qwen2_vl
cutoff_len: 8192
overwrite_cache: true
preprocessing_num_workers: 8

### output (separate per run)
output_dir: saves/qwen25vl-3b-lora
logging_steps: 5
save_steps: 100
save_total_limit: 3
plot_loss: true
overwrite_output_dir: true
report_to: none

### train (identical hyperparams to Run B)
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 1.0e-4
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.05
bf16: true
gradient_checkpointing: true
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 100
